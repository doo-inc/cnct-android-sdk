name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      # `build` compiles with warnings as errors, runs the tests (Robolectric included), lints the
      # Android modules, and builds the jar, the AAR and the sample. The runner image carries the
      # Android SDK. publishToMavenLocal is what JitPack runs, so a tag that would not install fails
      # here first.
      - run: ./gradlew build publishToMavenLocal --console=plain
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: reports
          path: '**/build/reports/'

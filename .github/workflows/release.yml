name: Release

on:
  push:
    tags: ['v*']

# A tag is what an app installs — through JitPack today, as
# com.github.doo-inc.cnct-android-sdk:cnct:<tag>. This makes sure a tag only goes out when the tests
# pass and the version Gradle publishes matches the tag it was cut from, and attaches the jars so a
# build with no JitPack access can still vendor them.
permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - name: Check the tag matches gradle.properties
        run: |
          tagged="${GITHUB_REF_NAME#v}"
          published="$(sed -nE 's/^version=(.+)$/\1/p' gradle.properties)"
          if [ "$tagged" != "$published" ]; then
            echo "Tag $GITHUB_REF_NAME does not match version $published in gradle.properties." >&2
            exit 1
          fi
      - run: ./gradlew build --console=plain
      - uses: softprops/action-gh-release@v2
        with:
          files: cnct/build/libs/*.jar
          generate_release_notes: true
